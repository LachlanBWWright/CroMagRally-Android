name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write   # needed to create GitHub releases

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Clone SDL3
        run: git clone --depth 1 https://github.com/libsdl-org/SDL.git extern/SDL

      - name: Copy SDL Java bridge files
        run: |
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp extern/SDL/android-project/app/src/main/java/org/libsdl/app/*.java \
             android/app/src/main/java/org/libsdl/app/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install CMake and NDK
        run: |
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;27.2.12479018"

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cromagrally-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0

      # Publish a rolling "latest" release only when main branch is updated
      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          TAG="latest-debug"
          TITLE="Latest Debug Build"
          NOTES="Automatically published debug APK from the latest commit on \`main\`.

          Commit: ${{ github.sha }}
          Built: $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Delete the old release + tag if they exist, then recreate
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" 2>/dev/null || true
          git push --delete origin "refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
