name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Record session start timestamp
        run: echo "Session started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Clone SDL3
        run: git clone --depth 1 https://github.com/libsdl-org/SDL.git extern/SDL

      - name: Copy SDL Java bridge files
        run: |
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp extern/SDL/android-project/app/src/main/java/org/libsdl/app/*.java \
             android/app/src/main/java/org/libsdl/app/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install CMake and NDK
        run: |
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;27.3.13750724"

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version=8.9

      - name: Build Debug APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> local.properties
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CroMagRally-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Record session end timestamp
        if: always()
        run: echo "Session ended at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
