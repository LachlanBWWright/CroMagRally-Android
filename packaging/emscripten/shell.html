<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cro-Mag Rally</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #111; color: #eee; font-family: sans-serif; }

    #launch-overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #111; z-index: 100;
    }
    #launch-overlay h1 { font-size: 2rem; margin-bottom: 1rem; color: #f90; }
    #launch-overlay p  { color: #aaa; margin-bottom: 1.5rem; text-align: center; max-width: 420px; }
    #launch-btn {
      padding: 0.75rem 2rem; font-size: 1.1rem; background: #f90;
      border: none; border-radius: 6px; cursor: pointer; color: #111; font-weight: bold;
    }
    #launch-btn:hover { background: #ffb733; }

    #canvas-container {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
    }
    #canvas {
      display: block;
      max-width: 100%; max-height: 100%;
      /* let the CSS size be overridden by SDL; default to 4:3 */
      aspect-ratio: 4/3;
      width: min(100vw, calc(100vh * 4/3));
    }

    #status {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 4px 8px; background: rgba(0,0,0,0.5);
      font-size: 0.75rem; color: #aaa; display: none;
    }

    #cheat-panel {
      position: fixed; top: 8px; right: 8px;
      background: rgba(0,0,0,0.75); border: 1px solid #444;
      border-radius: 6px; padding: 8px 12px; font-size: 0.8rem;
      display: none; flex-direction: column; gap: 6px; z-index: 50;
    }
    #cheat-panel h3 { color: #f90; margin-bottom: 4px; }
    #cheat-panel label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #cheat-toggle-btn {
      position: fixed; top: 8px; right: 8px;
      background: rgba(0,0,0,0.6); border: 1px solid #555;
      border-radius: 4px; color: #aaa; padding: 4px 8px;
      font-size: 0.75rem; cursor: pointer; z-index: 51; display: none;
    }
  </style>
</head>
<body>
  <!-- Launch overlay – required so browsers allow audio on first click -->
  <div id="launch-overlay">
    <h1>🏎️ Cro-Mag Rally</h1>
    <p>Click <strong>Play</strong> to load the game. The first load may take a moment while the game data downloads.</p>
    <button id="launch-btn">▶ Play</button>
  </div>

  <div id="canvas-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  </div>

  <div id="status"></div>

  <button id="cheat-toggle-btn" title="Cheat / Editor Commands">🔧</button>
  <div id="cheat-panel">
    <h3>Editor Commands</h3>
    <label>
      <input type="checkbox" id="chk-fence-collision" checked>
      Fence Collisions
    </label>
  </div>

  <!-- Emscripten-generated loader (injected by Emscripten into {{{ SCRIPT }}}) -->
  {{{ SCRIPT }}}

  <script>
    // ----------------------------------------------------------------
    // Emscripten Module configuration
    // ----------------------------------------------------------------
    var Module = {
      canvas: document.getElementById('canvas'),

      // Print to browser console
      print: function(text) { console.log('[game]', text); },
      printErr: function(text) { console.error('[game]', text); },

      // Show progress while loading .data file
      setStatus: function(text) {
        var el = document.getElementById('status');
        if (!text) { el.style.display = 'none'; return; }
        el.textContent = text;
        el.style.display = 'block';
      },

      onRuntimeInitialized: function() {
        // Hide status bar and show cheat toggle once game is ready
        document.getElementById('status').style.display = 'none';
        document.getElementById('cheat-toggle-btn').style.display = 'block';

        // Expose cheat helpers to page JS
        window.GameCheat = {
          setFenceCollision: Module.cwrap('WASM_SetFenceCollision', null, ['number']),
          getFenceCollision: Module.cwrap('WASM_GetFenceCollision', 'number', []),
        };

        // Sync checkbox initial state
        var chk = document.getElementById('chk-fence-collision');
        chk.checked = window.GameCheat.getFenceCollision() !== 0;
      },

      // Suppress the default fullscreen / pointer-lock prompts
      doNotCaptureKeyboard: false,
    };

    // ----------------------------------------------------------------
    // Launch button – defers main() until user gesture for audio
    // ----------------------------------------------------------------
    document.getElementById('launch-btn').addEventListener('click', function() {
      document.getElementById('launch-overlay').style.display = 'none';
    });

    // ----------------------------------------------------------------
    // Cheat panel toggle
    // ----------------------------------------------------------------
    document.getElementById('cheat-toggle-btn').addEventListener('click', function() {
      var panel = document.getElementById('cheat-panel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    });

    // Fence collision toggle
    document.getElementById('chk-fence-collision').addEventListener('change', function() {
      if (window.GameCheat) {
        window.GameCheat.setFenceCollision(this.checked ? 1 : 0);
      }
    });

    // ----------------------------------------------------------------
    // Utility: allow external JS to load a custom level .ter file.
    //
    // Usage (from a level editor or the browser console):
    //   loadLevelOverride(arrayBuffer, ':Terrain:MyLevel.ter');
    //
    // The file is written into the Emscripten virtual FS and the game
    // reads it on the *next* restart / page reload (it cannot hot-swap
    // a running level).  Pass the path as the second argument and set
    // the URL param  ?levelOverride=:Terrain:MyLevel.ter  before
    // reloading.
    // ----------------------------------------------------------------
    window.loadLevelOverride = function(arrayBuffer, virtualPath) {
      virtualPath = virtualPath || ':Terrain:override.ter';
      var uint8 = new Uint8Array(arrayBuffer);
      // Map the Mac-style colon path to a virtual FS path.
      // ':Terrain:foo.ter' → '/Data/Terrain/foo.ter' inside the WASM virtual FS.
      var vfsPath = virtualPath.replace(/:/g, '/').replace(/^\//, '/Data/');
      try {
        FS.unlink(vfsPath);
      } catch(e) {}
      FS.writeFile(vfsPath, uint8);
      console.log('[game] Level override written to', vfsPath,
                  '– reload with ?levelOverride=' + encodeURIComponent(virtualPath));
    };
  </script>
</body>
</html>
